[theme]
# Governance / public-sector theme: deep navy, teal accent, neutral greys.
primaryColor = "#0b2545"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f6f9"
textColor = "#16212b"
font = "sans serif"

[server]
port = 8501
headless = true
fileWatcherType = "auto"
maxUploadSize = 20

[browser]
gatherUsageStats = false

[client]
showErrorDetails = true
toolbarMode = "minimal"

[runner]
magicEnabled = true
fastReruns = true
